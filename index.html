<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>WILD FANFEST RIOT STORE</title>
  
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="page">
    <div class="leaf one">🌿</div>
    <div class="leaf two">🍃</div>
    <div class="leaf three">🌱</div>

    <header class="header public-header">
      <div class="logo-box" id="logoArea">LOGO<br>AREA</div>

      <div class="title-area">
        <p class="eyebrow">라이엇 게임즈와 현대백화점이 함께하는</p>
        <h1 class="title">WILD FANFEST</h1>
        <p class="subtitle">2026. 08. 07 — 08. 17 · RIOT STORE CATALOG</p>
      </div>

      <div class="tools">
        <input id="searchInput" class="search" type="search" placeholder="상품명 검색" autocomplete="off" enterkeyhint="search" aria-label="상품명 검색">
        <div class="count"><span id="visibleCount">0</span> / <span id="totalCount">0</span> items</div>
      </div>
    </header>

    <section id="catalog" class="catalog" aria-live="polite"></section>

    <footer class="footer public-footer">
      상품을 터치하면 큰 화면으로 확인할 수 있습니다.
    </footer>

    <div class="admin-entry public-footer">
      <button type="button" class="admin-entry-button" id="adminEntryButton">관리자</button>
    </div>

    <section class="admin-panel" id="adminPanel">
      <div class="admin-header">
        <div>
          <p class="eyebrow">WILD FANFEST RIOT STORE</p>
          <h2 class="admin-title">상품 관리자 페이지</h2>
        </div>
        <div class="admin-actions">
          <button type="button" class="admin-btn secondary" id="resetAdminData">초기 데이터 복원</button>
          <button type="button" class="admin-btn" id="saveAdminData">저장</button>
          <button type="button" class="admin-btn secondary" id="exitAdminMode">상품 페이지로 돌아가기</button>
        </div>
      </div>
      
      <div class="design-admin-box">
        <h3>디자인 이미지 관리</h3>
        <div class="design-admin-grid">
          <label>
            <span>전체 배경 이미지 경로</span>
            <input class="admin-field" id="backgroundPath" value="./images/background.jpg">
            <small>권장: ./images/background.jpg</small>
          </label>
          <label>
            <span>로고 이미지 경로</span>
            <input class="admin-field" id="logoPath" value="./images/logo.png">
            <small>권장: ./images/logo.png</small>
          </label>
        </div>
        <p class="admin-help">GitHub의 동일한 경로에 이미지를 업로드하거나 기존 파일을 교체하면 됩니다.</p>
      </div>

      <div class="admin-list" id="adminList"></div>
    </section>

  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalKoName">
    <div class="modal-box">
      <button class="close" id="closeModal" aria-label="팝업 닫기">×</button>
      <div class="modal-image"><img id="modalImg" src="" alt=""></div>
      <div class="modal-content">
        <p class="name-ko" id="modalKoName"></p>
        <p class="name-en" id="modalEnName"></p>
        <p class="price" id="modalPrice"></p>
        <p class="modal-desc" id="modalDesc"></p>
      </div>
    </div>
  </div>

  
  <script src="./script.js"></script>
</body>
</html>
