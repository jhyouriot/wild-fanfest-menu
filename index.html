<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <title>WILD FANFEST RIOT STORE</title>
  <style>
    :root{
      --bg:#f3f8dd;
      --panel:#ffffff;
      --text:#27343a;
      --sub:#66757c;
      --line:#d8e2c1;
      --accent:#284f56;
      --accent2:#90b747;
      --shadow:0 12px 30px rgba(32,53,44,.14);
      --radius:18px;
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:Pretendard, "Noto Sans KR", Arial, sans-serif;
      color:var(--text);
      background:
        linear-gradient(rgba(249,252,233,.86), rgba(243,248,221,.88)),
        url("images/background.jpg"),
        linear-gradient(180deg,#f9fce9 0%, var(--bg) 100%);
      background-size:cover;
      background-position:center top;
      background-repeat:no-repeat;
      background-attachment:fixed;
      min-height:100vh;
    }

    body.modal-open{overflow:hidden}

    .page{
      width:min(1480px, 100%);
      margin:0 auto;
      min-height:100vh;
      padding:30px 28px 70px;
      position:relative;
      overflow:hidden;
    }

    .leaf{
      position:fixed;
      z-index:-1;
      font-size:clamp(60px,8vw,130px);
      opacity:.12;
      user-select:none;
      pointer-events:none;
    }
    .leaf.one{left:-20px;bottom:30px;transform:rotate(-25deg)}
    .leaf.two{right:-25px;top:70px;transform:rotate(30deg)}
    .leaf.three{right:5%;bottom:-25px;transform:rotate(-10deg)}

    .header{
      display:grid;
      grid-template-columns:140px 1fr 220px;
      gap:24px;
      align-items:center;
      padding:24px 26px;
      margin-bottom:28px;
      background:rgba(255,255,255,.88);
      border:1px solid rgba(133,163,105,.35);
      border-radius:24px;
      box-shadow:var(--shadow);
      backdrop-filter:blur(8px);
    }

    .logo-box{
      width:120px;
      height:92px;
      border-radius:18px;
      display:flex;
      align-items:center;
      justify-content:center;
      background:linear-gradient(145deg,#e7f4d1,#ccebbd);
      border:1px dashed #7ba16d;
      color:var(--accent);
      font-weight:900;
      text-align:center;
      line-height:1.2;
      overflow:hidden;
    }

    .logo-box img{width:100%;height:100%;object-fit:contain}

    .title-area{text-align:center}
    .eyebrow{
      margin:0 0 5px;
      font-size:14px;
      font-weight:800;
      letter-spacing:.08em;
      color:#5d7d75;
    }
    .title{
      margin:0;
      font-size:clamp(30px,4vw,60px);
      line-height:1;
      font-weight:950;
      letter-spacing:-.04em;
      color:var(--accent);
    }
    .subtitle{
      margin:12px 0 0;
      font-size:clamp(14px,1.5vw,19px);
      color:var(--sub);
      font-weight:700;
    }

    .tools{
      display:flex;
      flex-direction:column;
      gap:10px;
    }

    .search{
      width:100%;
      height:44px;
      border:1px solid var(--line);
      border-radius:12px;
      padding:0 14px;
      font-size:14px;
      outline:none;
      background:#fff;
    }
    .search:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(144,183,71,.15)}
    .count{
      text-align:right;
      font-size:13px;
      color:var(--sub);
      font-weight:700;
    }

    .catalog{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
    }

    .product-card{
      border:1px solid rgba(89,121,92,.18);
      border-radius:var(--radius);
      overflow:hidden;
      background:var(--panel);
      box-shadow:0 7px 18px rgba(50,71,54,.08);
      cursor:pointer;
      transition:transform .2s ease, box-shadow .2s ease, border-color .2s ease;
      min-width:0;
    }

    .product-card:hover,
    .product-card:focus-visible{
      transform:translateY(-5px);
      box-shadow:0 16px 28px rgba(39,67,51,.16);
      border-color:rgba(63,104,75,.4);
      outline:none;
    }

    .image-wrap{
      aspect-ratio:1/1;
      background:#e9eef0;
      overflow:hidden;
      position:relative;
    }
    .image-wrap img{
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      transition:transform .25s ease;
    }
    .product-card:hover .image-wrap img{transform:scale(1.04)}
    .badge{
      position:absolute;
      left:12px;
      top:12px;
      max-width:calc(100% - 24px);
      padding:7px 11px;
      border:2px solid rgba(255,255,255,.9);
      border-radius:999px;
      background:rgba(39,67,69,.94);
      color:#fff;
      box-shadow:0 4px 12px rgba(0,0,0,.18);
      font-size:12px;
      line-height:1.2;
      font-weight:900;
      letter-spacing:-.02em;
      text-align:center;
      word-break:keep-all;
    }

    .info{padding:14px 15px 16px}
    .name-ko{
      margin:0;
      font-size:16px;
      font-weight:900;
      line-height:1.35;
      word-break:keep-all;
    }
    .name-en{
      margin:5px 0 10px;
      font-size:12px;
      line-height:1.35;
      color:var(--sub);
      min-height:32px;
    }
    .price{
      margin:0;
      text-align:right;
      font-size:17px;
      font-weight:950;
      color:var(--accent);
    }

    .empty{
      grid-column:1/-1;
      text-align:center;
      padding:80px 20px;
      color:var(--sub);
      background:rgba(255,255,255,.8);
      border-radius:18px;
    }

    .modal{
      position:fixed;
      inset:0;
      z-index:1000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:28px;
      background:rgba(13,25,24,.75);
      backdrop-filter:blur(5px);
    }
    .modal.open{display:flex}

    .modal-box{
      width:min(900px,100%);
      max-height:92vh;
      overflow:auto;
      position:relative;
      display:grid;
      grid-template-columns:minmax(280px,1.15fr) minmax(240px,.85fr);
      background:#fff;
      border-radius:26px;
      box-shadow:0 30px 90px rgba(0,0,0,.34);
    }

    .modal-image{
      aspect-ratio:1/1;
      min-height:100%;
      background:#edf1ee;
    }
    .modal-image img{
      width:100%;
      height:100%;
      object-fit:contain;
      display:block;
    }

    .modal-content{
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding:42px 34px;
    }
    .modal-content .name-ko{font-size:30px}
    .modal-content .name-en{font-size:16px;min-height:0;margin-top:9px}
    .modal-content .price{font-size:28px;text-align:left;margin-top:28px}
    .modal-desc{
      margin:20px 0 0;
      color:var(--sub);
      line-height:1.7;
      white-space:pre-line;
    }

    .close{
      position:absolute;
      right:16px;
      top:16px;
      width:42px;
      height:42px;
      border:0;
      border-radius:50%;
      background:rgba(255,255,255,.92);
      box-shadow:0 4px 14px rgba(0,0,0,.15);
      font-size:25px;
      cursor:pointer;
      z-index:2;
    }

    .footer{
      margin-top:32px;
      text-align:center;
      font-size:12px;
      color:#77847e;
    }

    @media (max-width:1050px){
      .header{grid-template-columns:100px 1fr}
      .logo-box{width:90px;height:72px}
      .tools{grid-column:1/-1;flex-direction:row;align-items:center}
      .count{min-width:90px}
      .catalog{grid-template-columns:repeat(3,minmax(0,1fr))}
    }

    @media (max-width:720px){
      .page{padding:16px 14px 46px}
      .header{
        grid-template-columns:1fr;
        padding:18px;
        gap:14px;
      }
      .logo-box{margin:auto}
      .tools{grid-column:auto}
      .catalog{grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
      .info{padding:11px 12px 13px}
      .name-ko{font-size:14px}
      .name-en{font-size:11px}
      .price{font-size:15px}
      .modal{padding:14px}
      .modal-box{grid-template-columns:1fr}
      .modal-content{padding:26px 22px 30px}
      .modal-content .name-ko{font-size:24px}
    }

    @media (max-width:390px){
      .catalog{grid-template-columns:1fr}
    }
  
    /* 태블릿 현장 비치용 최적화 */
    html, body {
      width: 100%;
      min-height: 100%;
      overscroll-behavior: none;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }

    body {
      -webkit-tap-highlight-color: transparent;
    }

    .header {
      position: sticky;
      top: 10px;
      z-index: 50;
    }

    .product-card {
      min-height: 0;
      touch-action: manipulation;
    }

    .product-card:active {
      transform: scale(.985);
    }

    .search {
      min-height: 52px;
      font-size: 16px;
    }

    .close {
      width: 54px;
      height: 54px;
      font-size: 32px;
    }

    @media (hover: none) and (pointer: coarse) {
      .product-card:hover {
        transform: none;
        box-shadow: 0 7px 18px rgba(50,71,54,.08);
      }

      .product-card:hover .image-wrap img {
        transform: none;
      }
    }

    /* 태블릿 가로 화면: 4열 */
    @media (min-width: 900px) and (max-width: 1400px) {
      .page {
        width: 100%;
        padding: 18px 20px 54px;
      }

      .header {
        grid-template-columns: 100px 1fr 240px;
        gap: 16px;
        padding: 16px 18px;
        margin-bottom: 18px;
        border-radius: 18px;
      }

      .logo-box {
        width: 92px;
        height: 72px;
      }

      .title {
        font-size: clamp(30px, 4vw, 48px);
      }

      .subtitle {
        font-size: 14px;
        margin-top: 8px;
      }

      .catalog {
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
      }

      .info {
        padding: 13px 14px 15px;
      }

      .name-ko {
        font-size: 16px;
        min-height: 44px;
      }

      .name-en {
        font-size: 12px;
        min-height: 34px;
      }

      .price {
        font-size: 18px;
      }
    }

    /* 태블릿 세로 화면: 3열 */
    @media (min-width: 600px) and (max-width: 899px) {
      .page {
        padding: 16px 16px 48px;
      }

      .header {
        grid-template-columns: 86px 1fr;
        top: 8px;
        gap: 12px;
        padding: 14px 15px;
        margin-bottom: 16px;
      }

      .logo-box {
        width: 78px;
        height: 62px;
      }

      .title-area {
        text-align: left;
      }

      .title {
        font-size: 34px;
      }

      .subtitle {
        font-size: 13px;
        margin-top: 6px;
      }

      .tools {
        grid-column: 1 / -1;
        flex-direction: row;
        align-items: center;
      }

      .catalog {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 12px;
      }

      .name-ko {
        font-size: 15px;
        min-height: 42px;
      }

      .name-en {
        min-height: 32px;
      }

      .price {
        font-size: 17px;
      }
    }

    /* 모바일: 2열 유지, 터치 영역 확대 */
    @media (max-width: 599px) {
      .header {
        position: relative;
        top: auto;
      }

      .search {
        min-height: 48px;
      }

      .product-card {
        border-radius: 14px;
      }

      .name-ko {
        min-height: 38px;
      }
    }

    /* 태블릿 팝업: 화면을 넓게 사용 */
    @media (min-width: 600px) {
      .modal {
        padding: 20px;
      }

      .modal-box {
        width: min(1080px, 96vw);
        max-height: 94vh;
      }

      .modal-content {
        padding: 44px 38px;
      }

      .modal-content .name-ko {
        font-size: 32px;
      }

      .modal-content .name-en {
        font-size: 17px;
      }

      .modal-content .price {
        font-size: 30px;
      }
    }

    @media (orientation: landscape) and (max-height: 820px) {
      .header {
        position: relative;
        top: auto;
      }

      .modal-box {
        max-height: 96vh;
      }

      .modal-content {
        padding-top: 30px;
        padding-bottom: 30px;
      }
    }

  
    /* 모든 상품 카드의 가격 위치를 동일하게 고정 */
    .product-card {
      display: flex;
      flex-direction: column;
      height: 100%;
    }

    .product-card .info {
      display: flex;
      flex-direction: column;
      flex: 1;
      width: 100%;
    }

    .product-card .name-ko {
      min-height: 44px;
    }

    .product-card .name-en {
      min-height: 34px;
      margin-bottom: 12px;
    }

    .product-card .price {
      margin-top: auto;
      padding-top: 8px;
      width: 100%;
    }

    @media (min-width: 900px) and (max-width: 1400px) {
      .product-card .info {
        min-height: 142px;
      }
    }

    @media (min-width: 600px) and (max-width: 899px) {
      .product-card .info {
        min-height: 138px;
      }
    }

    @media (max-width: 599px) {
      .product-card .info {
        min-height: 130px;
      }

      .product-card .name-ko {
        min-height: 40px;
      }

      .product-card .name-en {
        min-height: 32px;
      }
    }

  
    /* 첨부한 상품 배치 순서 */
    .catalog{
      display:block;
    }

    .catalog-section{
      margin-bottom:34px;
    }

    .section-title{
      display:inline-flex;
      align-items:center;
      justify-content:center;
      min-width:180px;
      min-height:40px;
      margin:0 0 14px;
      padding:6px 20px;
      border:2px solid rgba(44,68,65,.68);
      border-radius:4px;
      background:rgba(255,255,255,.9);
      color:#203c3e;
      font-size:clamp(20px,2.4vw,30px);
      font-weight:950;
      letter-spacing:-.04em;
    }

    .section-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:18px;
    }

    @media (min-width:900px) and (max-width:1400px){
      .section-grid{
        grid-template-columns:repeat(4,minmax(0,1fr));
        gap:14px;
      }
    }

    @media (min-width:600px) and (max-width:899px){
      .section-grid{
        grid-template-columns:repeat(3,minmax(0,1fr));
        gap:12px;
      }
    }

    @media (max-width:599px){
      .catalog-section{margin-bottom:26px}
      .section-title{
        min-width:150px;
        min-height:36px;
        padding:5px 15px;
        font-size:19px;
      }
      .section-grid{
        grid-template-columns:repeat(2,minmax(0,1fr));
        gap:10px;
      }
    }

    @media (max-width:390px){
      .section-grid{
        grid-template-columns:1fr;
      }
    }

  
    /* 관리자 모드 */
    .admin-entry{
      position:fixed;
      right:18px;
      bottom:18px;
      z-index:900;
      width:48px;
      height:48px;
      border:0;
      border-radius:50%;
      background:rgba(35,62,65,.92);
      color:#fff;
      font-size:20px;
      cursor:pointer;
      box-shadow:0 8px 24px rgba(0,0,0,.22);
    }

    .admin-bar{
      display:none;
      position:sticky;
      top:8px;
      z-index:80;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      margin:0 0 16px;
      padding:12px 14px;
      border-radius:14px;
      background:#203f43;
      color:#fff;
      box-shadow:0 8px 24px rgba(0,0,0,.18);
    }

    body.admin-mode .admin-bar{display:flex}

    .admin-bar strong{font-size:15px}
    .admin-bar-actions{display:flex;gap:8px}

    .admin-btn{
      min-height:38px;
      padding:7px 13px;
      border:1px solid rgba(255,255,255,.4);
      border-radius:9px;
      background:#fff;
      color:#203f43;
      font-weight:900;
      cursor:pointer;
    }

    .admin-btn.danger{
      background:#7b2525;
      color:#fff;
      border-color:#9d4a4a;
    }

    .sold-out-overlay{
      position:absolute;
      inset:0;
      z-index:4;
      display:flex;
      align-items:center;
      justify-content:center;
      background:rgba(20,20,20,.18);
      color:#fff;
      font-size:clamp(24px,3vw,42px);
      font-weight:950;
      letter-spacing:.04em;
      text-shadow:0 2px 12px rgba(0,0,0,.65);
      pointer-events:none;
    }

    .product-card.sold-out .image-wrap img{
      filter:grayscale(1) blur(3px);
      transform:scale(1.03);
    }

    .admin-controls{
      display:none;
      gap:7px;
      flex-wrap:wrap;
      padding:0 12px 12px;
    }

    body.admin-mode .admin-controls{display:flex}

    .admin-controls button{
      flex:1 1 44%;
      min-height:36px;
      padding:6px 8px;
      border:0;
      border-radius:8px;
      font-size:12px;
      font-weight:900;
      cursor:pointer;
    }

    .btn-soldout{background:#263238;color:#fff}
    .btn-restore{background:#dcefd6;color:#1f4b2b}
    .btn-edit{background:#e6edf8;color:#243d68}

    .admin-modal{
      position:fixed;
      inset:0;
      z-index:2000;
      display:none;
      align-items:center;
      justify-content:center;
      padding:20px;
      background:rgba(8,18,19,.76);
      backdrop-filter:blur(5px);
    }

    .admin-modal.open{display:flex}

    .admin-dialog{
      width:min(520px,100%);
      max-height:92vh;
      overflow:auto;
      padding:24px;
      border-radius:20px;
      background:#fff;
      box-shadow:0 24px 80px rgba(0,0,0,.36);
    }

    .admin-dialog h2{margin:0 0 18px;font-size:22px}

    .admin-field{
      display:block;
      margin-bottom:13px;
      font-size:13px;
      font-weight:900;
      color:#34464b;
    }

    .admin-field input{
      width:100%;
      min-height:46px;
      margin-top:6px;
      padding:0 12px;
      border:1px solid #cad4d5;
      border-radius:9px;
      font-size:15px;
    }

    .admin-dialog-actions{
      display:flex;
      justify-content:flex-end;
      gap:8px;
      margin-top:18px;
    }

    @media(max-width:599px){
      .admin-entry{right:12px;bottom:12px}
      .admin-bar{position:relative;top:auto}
    }

  </style>
</head>
<body>
  <main class="page">
    <div class="leaf one">🌿</div>
    <div class="leaf two">🍃</div>
    <div class="leaf three">🌱</div>

    <header class="header">
      <div class="logo-box" id="logoArea"><img src="images/logo.png" alt="WILD FANFEST 로고"></div>

      <div class="title-area">
        <p class="eyebrow">라이엇 게임즈와 현대백화점이 함께하는</p>
        <h1 class="title">WILD FANFEST</h1>
        <p class="subtitle">RIOT STORE CATALOG</p>
      </div>

      <div class="tools">
        <input id="searchInput" class="search" type="search" placeholder="상품명 검색" autocomplete="off" enterkeyhint="search" aria-label="상품명 검색">
        <div class="count"><span id="visibleCount">0</span> / <span id="totalCount">0</span> items</div>
      </div>
    </header>

    <div class="admin-bar" id="adminBar">
      <strong>관리자 모드</strong>
      <div class="admin-bar-actions">
        <button class="admin-btn" id="resetAdminData" type="button">전체 수정 초기화</button>
        <button class="admin-btn danger" id="adminLogout" type="button">관리자 종료</button>
      </div>
    </div>

    <section id="catalog" class="catalog" aria-live="polite"></section>

    <footer class="footer">
      상품을 터치하면 큰 화면으로 확인할 수 있습니다.
    </footer>
  </main>

  <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modalKoName">
    <div class="modal-box">
      <button class="close" id="closeModal" aria-label="팝업 닫기">×</button>
      <div class="modal-image"><img id="modalImg" src="" alt=""></div>
      <div class="modal-content">
        <p class="name-ko" id="modalKoName"></p>
        <p class="name-en" id="modalEnName"></p>
        <p class="price" id="modalPrice"></p>
        <p class="modal-desc" id="modalDesc"></p>
      </div>
    </div>
  </div>

  <script>
    /*
      상품 수정 방법

    const catalogSections = [
      {
        title: "신상 컬렉션",
        ids: [66, 67, 85, 84, 58, 59, 8, 9]
      },
            {
        title: "인기 액세서리&의류",
        ids: [49, 55, 56, 54, 60, 65, 57, 50, 51, 53, 52, 82, 81, 83, 86, 88, 89, 87, 10, 3, 6, 4, 5, 1, 2, 7, 12, 13, 11, 14, 15, 17, 16]
      },
                  {
        title: "피규어&스태츄",
        ids: [82, 81, 83, 86, 88, 89, 87, 10, 3, 6, 4, 5, 1, 2, 7, 12, 13, 11, 14, 15, 17, 16]
      },
      {
        title: "프리미엄 스태츄",
        ids: [25, 27, 30, 20, 26, 18, 19, 21, 22, 28, 29, 23, 24]
      },
            {
        title: "귀요미 컬렉션",
        ids: [62, 61, 63, 64, 40, 48, 32, 45, 41, 44, 43, 42, 31, 38, 37, 36, 39, 33, 34, 35, 80, 79, 46, 47, 68, 69, 70, 71, 76, 77, 78, 74, 75, 72, 73]
      }
    ];

    const displayOrder = catalogSections.flatMap(section => section.ids);
    const displayOrderIndex = new Map(
      displayOrder.map((id, index) => [id, index])
    );

    function sortByDisplayOrder(list) {
      return [...list].sort((a, b) =>
        (displayOrderIndex.get(a.id) ?? 9999) -
        (displayOrderIndex.get(b.id) ?? 9999)
      );
    }

    function productCardHtml(item) {
      return `
        <article class="product-card ${item.soldOut ? "sold-out" : ""}" tabindex="0" data-id="${item.id}" aria-label="${item.nameKo} 상세 보기">
          <div class="image-wrap">
            <img src="${item.image}" alt="${item.nameKo}" loading="lazy" draggable="false" onerror="this.src=makePlaceholder(${item.id}, 'NO IMAGE')">
            ${item.badge ? `<span class="badge">${item.badge}</span>` : ""}
            ${item.soldOut ? `<div class="sold-out-overlay">Sold out</div>` : ""}
          </div>
          <div class="info">
            <h2 class="name-ko">${item.nameKo}</h2>
            <p class="name-en">${item.nameEn}</p>
            <p class="price">${item.price}</p>
          </div>
          <div class="admin-controls">
            ${item.soldOut
              ? `<button class="btn-restore" type="button" data-action="restore" data-id="${item.id}">품절 해제</button>`
              : `<button class="btn-soldout" type="button" data-action="soldout" data-id="${item.id}">품절</button>`
            }
            <button class="btn-edit" type="button" data-action="edit" data-id="${item.id}">상품명·가격 수정</button>
          </div>
        </article>
      `;
    }


    const ADMIN_PASSWORD = "2026";
    const ADMIN_STORAGE_KEY = "wildFanfestAdminDataV1";
    let isAdminMode = false;

    function loadAdminData() {
      try {
        const saved = JSON.parse(localStorage.getItem(ADMIN_STORAGE_KEY) || "{}");
        products.forEach(item => {
          const data = saved[item.id];
          if (!data) return;
          if (typeof data.nameKo === "string") item.nameKo = data.nameKo;
          if (typeof data.nameEn === "string") item.nameEn = data.nameEn;
          if (typeof data.price === "string") item.price = data.price;
          item.soldOut = Boolean(data.soldOut);
        });
      } catch (error) {
        console.warn("관리자 데이터를 불러오지 못했습니다.", error);
      }
    }

    function saveAdminData() {
      const data = {};
      products.forEach(item => {
        data[item.id] = {
          nameKo: item.nameKo,
          nameEn: item.nameEn,
          price: item.price,
          soldOut: Boolean(item.soldOut)
        };
      });
      localStorage.setItem(ADMIN_STORAGE_KEY, JSON.stringify(data));
    }

    const catalog = document.getElementById("catalog");
    const searchInput = document.getElementById("searchInput");
    const visibleCount = document.getElementById("visibleCount");
    const totalCount = document.getElementById("totalCount");

    const modal = document.getElementById("modal");
    const modalImg = document.getElementById("modalImg");
    const modalKoName = document.getElementById("modalKoName");
    const modalEnName = document.getElementById("modalEnName");
    const modalPrice = document.getElementById("modalPrice");
    const modalDesc = document.getElementById("modalDesc");
    const closeModal = document.getElementById("closeModal");

    function render(list) {
      totalCount.textContent = products.length;
      visibleCount.textContent = list.length;

      if (!list.length) {
        catalog.innerHTML = '<div class="empty">검색 결과가 없습니다.</div>';
        return;
      }

      const visibleIds = new Set(list.map(item => item.id));
      const productMap = new Map(products.map(item => [item.id, item]));

      catalog.innerHTML = catalogSections.map(section => {
        const sectionItems = section.ids
          .filter(id => visibleIds.has(id))
          .map(id => productMap.get(id))
          .filter(Boolean);

        if (!sectionItems.length) return "";

        return `
          <section class="catalog-section">
            <h2 class="section-title">${section.title}</h2>
            <div class="section-grid">
              ${sectionItems.map(productCardHtml).join("")}
            </div>
          </section>
        `;
      }).join("");

      document.querySelectorAll(".product-card").forEach(card => {
        card.addEventListener("click", () => openProduct(Number(card.dataset.id)));
        card.addEventListener("keydown", e => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            openProduct(Number(card.dataset.id));
          }
        });
      });

      document.querySelectorAll(".admin-controls button").forEach(button => {
        button.addEventListener("click", event => {
          event.stopPropagation();
          const id = Number(button.dataset.id);
          const action = button.dataset.action;
          if (action === "soldout") setSoldOut(id, true);
          if (action === "restore") setSoldOut(id, false);
          if (action === "edit") openEditModal(id);
        });
      });
    }

    function openProduct(id) {
      const item = products.find(p => p.id === id);
      if (!item) return;

      modalImg.src = item.image;
      modalImg.alt = item.nameKo;
      modalKoName.textContent = item.nameKo;
      modalEnName.textContent = item.nameEn;
      modalPrice.textContent = item.price;
      modalDesc.textContent = item.description || "";
      modal.classList.add("open");
      document.body.classList.add("modal-open");
      closeModal.focus();
    }

    function hideModal() {
      modal.classList.remove("open");
      document.body.classList.remove("modal-open");
    }

    searchInput.addEventListener("input", e => {
      const keyword = e.target.value.trim().toLowerCase();
      const filtered = products.filter(item =>
        item.nameKo.toLowerCase().includes(keyword) ||
        item.nameEn.toLowerCase().includes(keyword)
      );
      render(sortByDisplayOrder(filtered));
    });

    closeModal.addEventListener("click", hideModal);
    modal.addEventListener("click", e => {
      if (e.target === modal) hideModal();
    });
    document.addEventListener("keydown", e => {
      if (e.key === "Escape") hideModal();
    });

    /*
      로고 사용 예시:
      document.getElementById("logoArea").innerHTML =
        '<img src="./images/logo.png" alt="WILD FANFEST 로고">';
    */



    const adminEntry = document.getElementById("adminEntry");
    const adminLoginModal = document.getElementById("adminLoginModal");
    const adminPassword = document.getElementById("adminPassword");
    const adminLoginSubmit = document.getElementById("adminLoginSubmit");
    const adminLoginCancel = document.getElementById("adminLoginCancel");
    const adminLogout = document.getElementById("adminLogout");
    const resetAdminData = document.getElementById("resetAdminData");

    const productEditModal = document.getElementById("productEditModal");
    const editProductId = document.getElementById("editProductId");
    const editNameKo = document.getElementById("editNameKo");
    const editNameEn = document.getElementById("editNameEn");
    const editPrice = document.getElementById("editPrice");
    const editSave = document.getElementById("editSave");
    const editCancel = document.getElementById("editCancel");

    function currentFilteredProducts() {
      const keyword = searchInput.value.trim().toLowerCase();
      return sortByDisplayOrder(products.filter(item =>
        item.nameKo.toLowerCase().includes(keyword) ||
        item.nameEn.toLowerCase().includes(keyword)
      ));
    }

    function rerenderCatalog() {
      render(currentFilteredProducts());
    }

    function enterAdminMode() {
      isAdminMode = true;
      document.body.classList.add("admin-mode");
      adminLoginModal.classList.remove("open");
      adminPassword.value = "";
      rerenderCatalog();
    }

    function exitAdminMode() {
      isAdminMode = false;
      document.body.classList.remove("admin-mode");
      rerenderCatalog();
    }

    function setSoldOut(id, soldOut) {
      const item = products.find(product => product.id === id);
      if (!item) return;
      item.soldOut = soldOut;
      saveAdminData();
      rerenderCatalog();
    }

    function openEditModal(id) {
      const item = products.find(product => product.id === id);
      if (!item) return;
      editProductId.value = String(id);
      editNameKo.value = item.nameKo;
      editNameEn.value = item.nameEn;
      editPrice.value = item.price;
      productEditModal.classList.add("open");
      editNameKo.focus();
    }

    function closeEditModal() {
      productEditModal.classList.remove("open");
    }

    adminEntry.addEventListener("click", () => {
      if (isAdminMode) {
        exitAdminMode();
        return;
      }
      adminLoginModal.classList.add("open");
      setTimeout(() => adminPassword.focus(), 50);
    });

    adminLoginSubmit.addEventListener("click", () => {
      if (adminPassword.value === ADMIN_PASSWORD) {
        enterAdminMode();
      } else {
        alert("비밀번호가 올바르지 않습니다.");
        adminPassword.select();
      }
    });

    adminPassword.addEventListener("keydown", event => {
      if (event.key === "Enter") adminLoginSubmit.click();
    });

    adminLoginCancel.addEventListener("click", () => {
      adminLoginModal.classList.remove("open");
      adminPassword.value = "";
    });

    adminLogout.addEventListener("click", exitAdminMode);

    editSave.addEventListener("click", () => {
      const id = Number(editProductId.value);
      const item = products.find(product => product.id === id);
      if (!item) return;
      item.nameKo = editNameKo.value.trim() || item.nameKo;
      item.nameEn = editNameEn.value.trim() || item.nameEn;
      item.price = editPrice.value.trim() || item.price;
      saveAdminData();
      closeEditModal();
      rerenderCatalog();
    });

    editCancel.addEventListener("click", closeEditModal);

    resetAdminData.addEventListener("click", () => {
      if (!confirm("저장된 상품명, 가격, 품절 상태를 모두 초기화할까요?")) return;
      localStorage.removeItem(ADMIN_STORAGE_KEY);
      location.reload();
    });

    adminLoginModal.addEventListener("click", event => {
      if (event.target === adminLoginModal) adminLoginModal.classList.remove("open");
    });

    productEditModal.addEventListener("click", event => {
      if (event.target === productEditModal) closeEditModal();
    });


    // 현장 태블릿 비치용: 이미지 길게 누르기 및 드래그 방지
    document.addEventListener("contextmenu", e => e.preventDefault());
    document.addEventListener("dragstart", e => e.preventDefault());

    // 화면 회전 또는 크기 변경 시 열린 팝업의 스크롤 위치 초기화
    window.addEventListener("resize", () => {
      if (modal.classList.contains("open")) {
        const box = modal.querySelector(".modal-box");
        if (box) box.scrollTop = 0;
      }
    });

    loadAdminData();
    render(sortByDisplayOrder(products));
  </script>

  <button class="admin-entry" id="adminEntry" type="button" aria-label="관리자 모드">⚙</button>

  <div class="admin-modal" id="adminLoginModal">
    <div class="admin-dialog">
      <h2>관리자 로그인</h2>
      <label class="admin-field">
        비밀번호
        <input id="adminPassword" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호 입력">
      </label>
      <div class="admin-dialog-actions">
        <button class="admin-btn" id="adminLoginCancel" type="button">취소</button>
        <button class="admin-btn" id="adminLoginSubmit" type="button">확인</button>
      </div>
    </div>
  </div>

  <div class="admin-modal" id="productEditModal">
    <div class="admin-dialog">
      <h2>상품 정보 수정</h2>
      <input id="editProductId" type="hidden">
      <label class="admin-field">
        상품명
        <input id="editNameKo" type="text">
      </label>
      <label class="admin-field">
        영문 상품명
        <input id="editNameEn" type="text">
      </label>
      <label class="admin-field">
        가격
        <input id="editPrice" type="text" placeholder="예: 45,000원">
      </label>
      <div class="admin-dialog-actions">
        <button class="admin-btn" id="editCancel" type="button">취소</button>
        <button class="admin-btn" id="editSave" type="button">저장</button>
      </div>
    </div>
  </div>
